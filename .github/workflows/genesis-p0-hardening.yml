
name: GENESIS P0 hardening and verification

on:
  pull_request:
    branches:
      - genesis-5-recovery
  push:
    branches:
      - claude/genesis-visual-redesign
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate and build GENESIS server
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: telegram-integration/GENESIS_4.0_FINAL/source/server

    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://genesis:genesis@127.0.0.1:5432/genesis?sslmode=require
      AUTH_SECRET: "genesis-ci-auth-secret-not-for-production-000000000000"
      GENESIS_BOOTSTRAP_TOKEN: "genesis-ci-bootstrap-token-not-for-production-000000"
      APP_URL: https://genesis.example
      GENESIS_APP_ORIGIN: https://genesis.example
      OPENAI_API_KEY: sk-test-placeholder
      OPENAI_MODEL: gpt-5.6
      TELEGRAM_BOT_TOKEN: "123456789:TEST_TOKEN_NOT_REAL"
      TELEGRAM_WEBHOOK_SECRET: "test-webhook-secret"
      TELEGRAM_WEBAPP_URL: https://genesis.example/telegram
      GENESIS_TELEGRAM_ALLOWED_USER_ID: "123456789"
      GENESIS_TELEGRAM_OWNER_USER_ID: "ci-owner"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: telegram-integration/GENESIS_4.0_FINAL/source/server/package-lock.json

      - name: Install locked dependencies
        run: npm ci --include=dev --audit=false

      - name: Dependency security audit
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high --json > npm-audit.json

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-npm-audit
          path: telegram-integration/GENESIS_4.0_FINAL/source/server/npm-audit.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npm run typecheck

      - name: Automated tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Enforce dependency security audit
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [ "$AUDIT_OUTCOME" = "failure" ]; then
            echo "::error::High or critical dependency vulnerabilities detected. Download genesis-npm-audit artifact."
            exit 1
          fi
