
name: GENESIS Telegram archive extraction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-telegram-archive.yml

permissions:
  contents: write

jobs:
  inspect-and-extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect and safely extract source archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import re

          archive = Path("GENESIS_5.0_TELEGRAM_INTEGRATION_SOURCE.zip")
          destination = Path("telegram-integration")

          if not archive.is_file():
              raise SystemExit("STOP: source archive not found")

          if destination.exists():
              raise SystemExit(
                  "STOP: telegram-integration already exists; "
                  "refusing to overwrite"
              )

          # Environment templates are allowed by filename.
          # Their contents are still scanned for credentials.
          secret_name = re.compile(
              r"(^|/)(\.env|"
              r"\.env\.(?!example$|sample$|template$|dist$)[^/]+|"
              r"id_rsa|id_ed25519|.*\.pem|.*\.p12|.*\.key|"
              r"credentials\.json)$",
              re.I,
          )

          secret_patterns = [
              (
                  re.compile(
                      rb"-----BEGIN "
                      rb"(?:RSA |EC |OPENSSH )?PRIVATE KEY-----"
                  ),
                  "private-key",
              ),
              (
                  re.compile(
                      rb"\b\d{6,12}:[A-Za-z0-9_-]{30,}\b"
                  ),
                  "telegram-bot-token",
              ),
              (
                  re.compile(
                      rb"\bgh[pousr]_[A-Za-z0-9]{30,}\b"
                  ),
                  "github-token",
              ),
              (
                  re.compile(
                      rb"""(?i)\b(?:api[_-]?key|secret|token|password)\s*[:=]\s*["'][^"']{12,}["']"""
                  ),
                  "credential-like-value",
              ),
          ]

          with ZipFile(archive) as zf:
              entries = zf.infolist()

              if not entries:
                  raise SystemExit("STOP: archive is empty")

              unsafe_paths = []
              possible_secrets = []

              for entry in entries:
                  name = entry.filename.replace("\\", "/")
                  path = PurePosixPath(name)

                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or not path.parts
                      or ".git" in path.parts
                  ):
                      unsafe_paths.append(name)

                  if secret_name.search(name):
                      possible_secrets.append(
                          (name, "secret-like-filename")
                      )

                  if not entry.is_dir() and entry.file_size <= 2_000_000:
                      data = zf.read(entry)

                      for pattern, label in secret_patterns:
                          if pattern.search(data):
                              possible_secrets.append((name, label))

              if unsafe_paths:
                  print(
                      "STOP: unsafe archive paths detected; "
                      "nothing was extracted"
                  )

                  for name in unsafe_paths:
                      print(f"UNSAFE PATH: {name}")

                  raise SystemExit(2)

              if possible_secrets:
                  print(
                      "STOP: possible credentials detected; "
                      "nothing was extracted"
                  )

                  for name, label in sorted(set(possible_secrets)):
                      print(f"REVIEW REQUIRED: {label} in {name}")

                  raise SystemExit(3)

              expanded_size = sum(
                  entry.file_size for entry in entries
              )

              if expanded_size > 200_000_000:
                  raise SystemExit(
                      "STOP: expanded archive exceeds 200 MB"
                  )

              destination.mkdir()

              for entry in entries:
                  name = entry.filename.replace("\\", "/")
                  target = destination.joinpath(
                      *PurePosixPath(name).parts
                  )

                  if entry.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue

                  target.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  with zf.open(entry) as source:
                      with target.open("wb") as output:
                          while True:
                              chunk = source.read(1024 * 1024)

                              if not chunk:
                                  break

                              output.write(chunk)

              print(
                  f"SUCCESS: extracted {len(entries)} archive entries "
                  f"({expanded_size} bytes) into {destination}/"
              )
          PY

      - name: Commit extracted files
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add telegram-integration

          if git diff --cached --quiet; then
            echo "No extracted files to commit"
          else
            git commit \
              -m "Extract GENESIS 5.0 Telegram integration source"

            git push
          fi
