
name: Apply GENESIS Telegram update

on:
  push:
    branches:
      - genesis-5-recovery
    paths:
      - ".github/workflows/apply-genesis-telegram-update.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: genesis-5-recovery
          fetch-depth: 0

      - name: Validate and extract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath
          from pathlib import Path

          archive = Path("GENESIS_5.0_TELEGRAM_UPDATE.zip")
          if not archive.is_file():
              raise SystemExit("Update archive not found")

          with ZipFile(archive) as z:
              entries = z.infolist()
              if not entries:
                  raise SystemExit("Empty archive")

              for e in entries:
                  p = PurePosixPath(e.filename)
                  if p.is_absolute() or ".." in p.parts or ".git" in p.parts:
                      raise SystemExit("Unsafe archive path: " + e.filename)
                  if any(x == ".env" or x.startswith(".env.") and x not in (".env.example", ".env.sample") for x in p.parts):
                      raise SystemExit("Environment file blocked: " + e.filename)

              if sum(e.file_size for e in entries) > 200_000_000:
                  raise SystemExit("Archive too large")

              z.extractall(".")

          print("Archive extracted successfully")
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply GENESIS 5.0 Telegram update"
          git push origin HEAD:genesis-5-recovery
