services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: genesis
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - genesis_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genesis -d genesis"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://genesis:${POSTGRES_PASSWORD}@db:5432/genesis?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      GENESIS_BOOTSTRAP_TOKEN: ${GENESIS_BOOTSTRAP_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      APP_URL: ${APP_URL:-http://localhost:3000}
      GENESIS_APP_ORIGIN: ${GENESIS_APP_ORIGIN:-http://localhost:3000}
      GENESIS_AI_PROVIDER: ${GENESIS_AI_PROVIDER:-openai}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-}
      GENESIS_TELEGRAM_ALLOWED_USER_ID: ${GENESIS_TELEGRAM_ALLOWED_USER_ID:-}
      GENESIS_TELEGRAM_OWNER_USER_ID: ${GENESIS_TELEGRAM_OWNER_USER_ID:-}
    ports:
      - "3000:3000"
volumes:
  genesis_db:
